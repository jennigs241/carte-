<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Linktree</title>
    <!-- Police moderne et icônes FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Lien vers le fichier CSS externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Photo de profil -->
        <img src="https://via.placeholder.com/100" alt="Avatar" class="profile-img">
        
        <!-- Nom et Bio -->
        <h1>Votre Nom / Marque</h1>
        <p class="bio">Créateur de contenu | Partage de mes meilleurs outils et projets du moment 👇</p>

        <!-- Liste des liens principaux -->
        <div class="links-list">
            <a href="https://votre-site.com" target="_blank" class="link-btn">
                <i class="fa-solid fa-globe icon-left"></i>
                <span>Mon Site Web Officiel</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a href="https://youtube.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-youtube icon-left" style="color: #ff0000;"></i>
                <span>Regarder ma dernière vidéo</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram icon-left" style="color: #e1306c;"></i>
                <span>Suivez-moi sur Instagram</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=beaugard.fongbemi@ogoouegroupe.ga" class="link-btn">
                <i class="fa-solid fa-envelope icon-left" style="color: #3b82f6;"></i>
                <span>Me contacter par e-mail</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>

        <!-- Icônes des réseaux sociaux -->
        <div class="socials">
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-github"></i></a>
        </div>
    </div>

</body>
</html>
